<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro WhatsApp QR Generator</title>
  
  <!-- Libraries for Custom QR & PDF Download -->
  <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    .container {
      background-color: #1e293b;
      padding: 25px;
      border-radius: 12px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #22c55e;
    }

    .input-group, .custom-section {
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
      margin-bottom: 15px;
    }

    label {
      font-size: 14px;
      color: #94a3b8;
    }

    input[type="text"], input[type="file"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
    }

    .color-picker {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="color"] {
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    button {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
      transition: 0.3s;
    }

    button:hover {
      background-color: #16a34a;
    }

    #qr-container {
      margin-top: 20px;
      display: flex;
      justify-content: center;
    }

    .download-options {
      margin-top: 15px;
      display: flex;
      gap: 8px;
    }

    .download-options button {
      font-size: 12px;
      padding: 8px;
      background-color: #3b82f6;
    }

    .download-options button:hover {
      background-color: #2563eb;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>WhatsApp QR Generator Pro</h2>

    <!-- Input Section -->
    <div class="input-group">
      <label>Phone Number (with Country Code):</label>
      <input type="text" id="phone" placeholder="e.g. 919876543210">

      <label>Preset Message (Optional):</label>
      <input type="text" id="message" placeholder="e.g. Hi, I want to order!">
    </div>

    <!-- Customization Options -->
    <div class="custom-section">
      <h3>Design Customization</h3>
      
      <div class="color-picker">
        <label for="qrColor">QR Dots Color:</label>
        <input type="color" id="qrColor" value="#000000">
      </div>

      <div class="color-picker">
        <label for="bgColor">Background Color:</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>

      <div class="logo-picker">
        <label for="logoInput">Upload Center Logo:</label>
        <input type="file" id="logoInput" accept="image/*">
      </div>
    </div>

    <button id="generateBtn">Generate QR Code</button>

    <!-- QR Output Container -->
    <div id="qr-container">
      <div id="qr-canvas"></div>
    </div>

    <!-- Download Buttons -->
    <div class="download-options" id="downloadSection" style="display: none;">
      <button id="downloadPng">Download PNG</button>
      <button id="downloadPdf">Download PDF</button>
      <button id="downloadSvg">Download SVG</button>
    </div>
  </div>

  <script>
    let uploadedLogo = null;

    // Initialize QR Code Styling Instance
    const qrCode = new QRCodeStyling({
      width: 250,
      height: 250,
      type: "canvas",
      data: "https://wa.me/",
      dotsOptions: { color: "#000000", type: "rounded" },
      backgroundOptions: { color: "#ffffff" },
      imageOptions: { crossOrigin: "anonymous", margin: 5, imageSize: 0.3 }
    });

    // Render empty QR container initially
    qrCode.append(document.getElementById("qr-canvas"));

    // Logo Upload Event
    document.getElementById("logoInput").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = () => {
          uploadedLogo = reader.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // Generate Button Click
    document.getElementById("generateBtn").addEventListener("click", () => {
      const phone = document.getElementById("phone").value.trim();
      const message = document.getElementById("message").value.trim();
      const dotColor = document.getElementById("qrColor").value;
      const bgColor = document.getElementById("bgColor").value;

      if (!phone) {
        alert("Please enter a valid phone number!");
        return;
      }

      // Construct WhatsApp Link
      let waUrl = `https://wa.me/${phone}`;
      if (message) {
        waUrl += `?text=${encodeURIComponent(message)}`;
      }

      // Update QR Options
      qrCode.update({
        data: waUrl,
        dotsOptions: { color: dotColor },
        backgroundOptions: { color: bgColor },
        image: uploadedLogo ? uploadedLogo : ""
      });

      // Show Download Buttons
      document.getElementById("downloadSection").style.display = "flex";
    });

    // Download Handlers
    document.getElementById("downloadPng").addEventListener("click", () => {
      qrCode.download({ name: "whatsapp-qr", extension: "png" });
    });

    document.getElementById("downloadSvg").addEventListener("click", () => {
      qrCode.download({ name: "whatsapp-qr", extension: "svg" });
    });

    document.getElementById("downloadPdf").addEventListener("click", () => {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      qrCode.getRawData("png").then((blob) => {
        const reader = new FileReader();
        reader.readAsDataURL(blob);
        reader.onloadend = () => {
          doc.text("Scan QR Code to Chat on WhatsApp", 20, 20);
          doc.addImage(reader.result, "PNG", 50, 40, 110, 110);
          doc.save("whatsapp-qr.pdf");
        };
      });
    });
  </script>
</body>
</html>
