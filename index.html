<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro WhatsApp QR Generator</title>

  <!-- Fast & Working QR Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #0f172a;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 15px;
    }

    .container {
      background-color: #1e293b;
      padding: 20px;
      border-radius: 12px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
      text-align: center;
    }

    h2 {
      color: #22c55e;
      margin-bottom: 15px;
    }

    .input-group, .custom-section {
      display: flex;
      flex-direction: column;
      gap: 8px;
      text-align: left;
      margin-bottom: 12px;
    }

    label {
      font-size: 13px;
      color: #94a3b8;
    }

    input[type="text"] {
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: white;
    }

    .color-picker {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    input[type="color"] {
      border: none;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      background: transparent;
    }

    button {
      background-color: #22c55e;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
      margin-top: 10px;
    }

    #qrcode {
      margin-top: 20px;
      display: flex;
      justify-content: center;
      background: white;
      padding: 15px;
      border-radius: 8px;
      min-height: 180px;
      align-items: center;
    }

    #qrcode img {
      display: block;
      margin: 0 auto;
    }

    .download-options {
      margin-top: 15px;
      display: flex;
      gap: 8px;
    }

    .download-options button {
      font-size: 12px;
      padding: 10px;
      background-color: #3b82f6;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>WhatsApp QR Generator Pro</h2>

    <div class="input-group">
      <label>Phone Number (with Country Code):</label>
      <input type="text" id="phone" placeholder="e.g. 919852589062">

      <label>Preset Message (Optional):</label>
      <input type="text" id="message" placeholder="e.g. Hi, I want to order!">
    </div>

    <div class="custom-section">
      <h3>Design Customization</h3>
      
      <div class="color-picker">
        <label for="qrColor">QR Dots Color:</label>
        <input type="color" id="qrColor" value="#000000">
      </div>

      <div class="color-picker">
        <label for="bgColor">Background Color:</label>
        <input type="color" id="bgColor" value="#ffffff">
      </div>
    </div>

    <button id="generateBtn">Generate QR Code</button>

    <!-- QR Container -->
    <div id="qrcode">QR Code Yahan Dikhaye Dega</div>

    <div class="download-options" id="downloadSection" style="display: none;">
      <button id="downloadPng">Download PNG</button>
      <button id="downloadPdf">Download PDF</button>
    </div>
  </div>

  <script>
    let qrcodeInstance = null;

    document.getElementById("generateBtn").addEventListener("click", function() {
      const phone = document.getElementById("phone").value.trim();
      const message = document.getElementById("message").value.trim();
      const dotColor = document.getElementById("qrColor").value;
      const bgColor = document.getElementById("bgColor").value;

      if (!phone) {
        alert("Kripya valid phone number dalein!");
        return;
      }

      let waUrl = `https://wa.me/${phone}`;
      if (message) {
        waUrl += `?text=${encodeURIComponent(message)}`;
      }

      const qrcodeDiv = document.getElementById("qrcode");
      qrcodeDiv.innerHTML = ""; // Clear old QR

      // Generate New QR
      qrcodeInstance = new QRCode(qrcodeDiv, {
        text: waUrl,
        width: 180,
        height: 180,
        colorDark: dotColor,
        colorLight: bgColor,
        correctLevel: QRCode.CorrectLevel.H
      });

      document.getElementById("downloadSection").style.display = "flex";
    });

    // PNG Download
    document.getElementById("downloadPng").addEventListener("click", function() {
      const img = document.querySelector("#qrcode img");
      if (img) {
        const a = document.createElement("a");
        a.href = img.src;
        a.download = "whatsapp-qr.png";
        a.click();
      }
    });

    // PDF Download
    document.getElementById("downloadPdf").addEventListener("click", function() {
      const img = document.querySelector("#qrcode img");
      if (img) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        doc.text("Scan QR Code to Chat on WhatsApp", 20, 20);
        doc.addImage(img.src, "PNG", 50, 40, 100, 100);
        doc.save("whatsapp-qr.pdf");
      }
    });
  </script>
</body>
</html>
